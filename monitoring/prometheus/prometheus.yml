global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "vllm-mistral"
    static_configs:
      - targets: ["mistral-g0:8000"]
        labels:
          gpu: "0"
          model_lane: "mistral7b"
      - targets: ["mistral-g1:8000"]
        labels:
          gpu: "1"
          model_lane: "mistral7b"
    metrics_path: /metrics

  - job_name: "vllm-small32"
    static_configs:
      - targets: ["small32-tp4:8000"]
        labels:
          gpu_group: "4-7"
          model_lane: "mistral-small-3.2"
    metrics_path: /metrics

  - job_name: "nginx-mistral"
    static_configs:
      - targets: ["nginx-exporter-mistral:9113"]
        labels:
          model_lane: "mistral7b"
    metrics_path: /metrics

  - job_name: "nginx-small32"
    static_configs:
      - targets: ["nginx-exporter-small32:9113"]
        labels:
          model_lane: "mistral-small-3.2"
    metrics_path: /metrics

  - job_name: "nvidia-gpu"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
