global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets: ["vllm-g0:8000"]
        labels:
          gpu: "0"
      - targets: ["vllm-g1:8000"]
        labels:
          gpu: "1"
      - targets: ["vllm-g2:8000"]
        labels:
          gpu: "2"
      - targets: ["vllm-g3:8000"]
        labels:
          gpu: "3"
      - targets: ["vllm-g4:8000"]
        labels:
          gpu: "4"
      - targets: ["vllm-g5:8000"]
        labels:
          gpu: "5"
      - targets: ["vllm-g6:8000"]
        labels:
          gpu: "6"
      - targets: ["vllm-g7:8000"]
        labels:
          gpu: "7"
    metrics_path: /metrics

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    metrics_path: /metrics

  - job_name: "nvidia-gpu"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
