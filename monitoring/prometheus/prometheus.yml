global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets:
          # GPU 0
          - "vllm-g0-i0:8000"
          - "vllm-g0-i1:8000"
          - "vllm-g0-i2:8000"
          # GPU 1
          - "vllm-g1-i0:8000"
          - "vllm-g1-i1:8000"
          - "vllm-g1-i2:8000"
          # GPU 2
          - "vllm-g2-i0:8000"
          - "vllm-g2-i1:8000"
          - "vllm-g2-i2:8000"
          # GPU 3
          - "vllm-g3-i0:8000"
          - "vllm-g3-i1:8000"
          - "vllm-g3-i2:8000"
          # GPU 4
          - "vllm-g4-i0:8000"
          - "vllm-g4-i1:8000"
          - "vllm-g4-i2:8000"
          # GPU 5
          - "vllm-g5-i0:8000"
          - "vllm-g5-i1:8000"
          - "vllm-g5-i2:8000"
          # GPU 6
          - "vllm-g6-i0:8000"
          - "vllm-g6-i1:8000"
          - "vllm-g6-i2:8000"
          # GPU 7
          - "vllm-g7-i0:8000"
          - "vllm-g7-i1:8000"
          - "vllm-g7-i2:8000"
    metrics_path: /metrics

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: /metrics

  - job_name: "nvidia-gpu"
    static_configs:
      - targets: ["localhost:9400"]  # nvidia dcgm-exporter if installed
