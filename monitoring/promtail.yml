server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/mistral/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            request_time: request_time
            upstream: upstream_addr
      - labels:
          status:
          upstream:

  - job_name: vllm
    static_configs:
      - targets: [localhost]
        labels:
          job: vllm
          __path__: /var/log/mistral/vllm*.log
