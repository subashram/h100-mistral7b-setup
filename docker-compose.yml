# =============================================================================
# Mistral 7B Production Stack — 8xH100, 8 vLLM workers
# Baseline topology: 1 vLLM instance per GPU for multi-user throughput.
# =============================================================================
# Usage: docker compose --env-file .env up -d
# =============================================================================

x-vllm-base: &vllm-base
  image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
  runtime: nvidia
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
  shm_size: ${VLLM_SHM_SIZE:-8g}
  ulimits:
    memlock: -1
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - ${MODEL_CACHE_ROOT:-/mnt/compass/mistral/model-cache}:/root/.cache/huggingface
    - ${VLLM_CACHE_ROOT:-/mnt/compass/mistral/vllm-cache}:/root/.cache/vllm
    - ${LOG_ROOT:-/mnt/compass/mistral/logs}:/var/log/vllm
  command: >
    ${MODEL_ID:-mistralai/Mistral-7B-Instruct-v0.3}
    --dtype ${MODEL_DTYPE:-bfloat16}
    --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90}
    --max-model-len ${MAX_MODEL_LEN:-8192}
    --tokenizer_mode ${TOKENIZER_MODE:-hf}
    --config_format ${CONFIG_FORMAT:-hf}
    --load_format ${LOAD_FORMAT:-hf}
    --enable-auto-tool-choice
    --tool-call-parser mistral
    --chat-template ${CHAT_TEMPLATE:-/vllm-workspace/examples/tool_chat_template_mistral_parallel.jinja}
    --uvicorn-log-level warning
    --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-16384}
    --max-num-seqs ${MAX_NUM_SEQS:-256}
    --enable-prefix-caching
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: ${HEALTH_CHECK_INTERVAL:-10s}
    timeout: ${HEALTH_CHECK_TIMEOUT:-5s}
    retries: ${HEALTH_CHECK_RETRIES:-3}
    start_period: 120s
  deploy:
    resources:
      limits:
        cpus: "${VLLM_CPU_LIMIT:-10}"
        memory: ${VLLM_MEM_LIMIT:-48g}

services:
  # ---------------------------------------------------------------------------
  # Baseline serving topology: one worker per GPU
  # ---------------------------------------------------------------------------
  vllm-g0:
    <<: *vllm-base
    container_name: vllm-g0
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports: ["8000:8000"]

  vllm-g1:
    <<: *vllm-base
    container_name: vllm-g1
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    ports: ["8001:8000"]

  vllm-g2:
    <<: *vllm-base
    container_name: vllm-g2
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
    ports: ["8002:8000"]

  vllm-g3:
    <<: *vllm-base
    container_name: vllm-g3
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
    ports: ["8003:8000"]

  vllm-g4:
    <<: *vllm-base
    container_name: vllm-g4
    environment:
      - NVIDIA_VISIBLE_DEVICES=4
    ports: ["8004:8000"]

  vllm-g5:
    <<: *vllm-base
    container_name: vllm-g5
    environment:
      - NVIDIA_VISIBLE_DEVICES=5
    ports: ["8005:8000"]

  vllm-g6:
    <<: *vllm-base
    container_name: vllm-g6
    environment:
      - NVIDIA_VISIBLE_DEVICES=6
    ports: ["8006:8000"]

  vllm-g7:
    <<: *vllm-base
    container_name: vllm-g7
    environment:
      - NVIDIA_VISIBLE_DEVICES=7
    ports: ["8007:8000"]

  # ---------------------------------------------------------------------------
  # API Gateway — Nginx
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mistral-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_HTTP_PORT:-8081}:80"
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api_keys.conf:/etc/nginx/api_keys.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ${LOG_ROOT:-/mnt/compass/mistral/logs}/nginx:/var/log/nginx
    depends_on:
      vllm-g0: { condition: service_healthy }
      vllm-g1: { condition: service_healthy }
      vllm-g2: { condition: service_healthy }
      vllm-g3: { condition: service_healthy }
      vllm-g4: { condition: service_healthy }
      vllm-g5: { condition: service_healthy }
      vllm-g6: { condition: service_healthy }
      vllm-g7: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mistral-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PROMETHEUS_DATA_ROOT:-/mnt/compass/mistral/prometheus}:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mistral-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ${GRAFANA_DATA_ROOT:-/mnt/compass/mistral/grafana}:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mistral-alertmanager
    restart: unless-stopped
    ports: ["9093:9093"]
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # ---------------------------------------------------------------------------
  # Log aggregation (optional — Loki + Promtail)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: mistral-loki
    restart: unless-stopped
    ports: ["3100:3100"]
    volumes:
      - ${LOKI_DATA_ROOT:-/mnt/compass/mistral/loki}:/loki

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: mistral-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      nginx:
        condition: service_started

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: mistral-dcgm-exporter
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports: ["9400:9400"]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: mistral-promtail
    restart: unless-stopped
    volumes:
      - ${LOG_ROOT:-/mnt/compass/mistral/logs}:/var/log/compass/mistral:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
