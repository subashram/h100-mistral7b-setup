# =============================================================================
# API Key → Identity Mapping
# =============================================================================
# Usage: Authorization: Bearer sk-prod-key-1
# Add/remove keys here and reload nginx: docker exec mistral-gateway nginx -s reload

map $http_authorization $api_key_name {
    default                         "";
    "Bearer sk-prod-key-1"          "client-a";
    "Bearer sk-prod-key-2"          "client-b";
    # Add more keys as needed:
    # "Bearer sk-prod-key-3"        "client-c";
}
