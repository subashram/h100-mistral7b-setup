# =============================================================================
# Mistral 7B API Gateway — Production Nginx Config
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # General
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 1000;
    client_max_body_size 10m;
    server_tokens off;
    map_hash_bucket_size 128;

    # -------------------------------------------------------------------------
    # Logging — structured JSON for log aggregation
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"api_key_id":"$api_key_name"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # API Key Authentication
    # -------------------------------------------------------------------------
    # Maps API keys to names for logging/tracking
    include /etc/nginx/api_keys.conf;

    # -------------------------------------------------------------------------
    # Rate Limiting
    # -------------------------------------------------------------------------
    # Global safeguard at the gateway edge.
    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/s;
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Upstream — 8 vLLM workers, one per GPU
    # -------------------------------------------------------------------------
    upstream mistral_cluster {
        least_conn;

        server vllm-g0:8000 max_fails=3 fail_timeout=30s;
        server vllm-g1:8000 max_fails=3 fail_timeout=30s;
        server vllm-g2:8000 max_fails=3 fail_timeout=30s;
        server vllm-g3:8000 max_fails=3 fail_timeout=30s;
        server vllm-g4:8000 max_fails=3 fail_timeout=30s;
        server vllm-g5:8000 max_fails=3 fail_timeout=30s;
        server vllm-g6:8000 max_fails=3 fail_timeout=30s;
        server vllm-g7:8000 max_fails=3 fail_timeout=30s;
    }

    # -------------------------------------------------------------------------
    # HTTPS Server (production)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health endpoint (no auth required)
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Metrics endpoint (internal only)
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://mistral_cluster/metrics;
        }

        # Nginx exporter status page
        location /nginx_status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            stub_status;
        }

        # API endpoints
        location /v1/ {
            # --- Auth ---
            if ($api_key_name = "") {
                return 401 '{"error":"Invalid or missing API key"}';
            }

            # --- Rate limiting ---
            limit_req zone=global burst=100 nodelay;

            # --- Proxy settings ---
            proxy_pass http://mistral_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;

            # Retry on upstream failure (safe for idempotent inference)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Response headers
            add_header X-Request-ID $request_id always;
            add_header X-Upstream $upstream_addr always;
        }

        # Block everything else
        location / {
            return 404 '{"error":"Not found"}';
            add_header Content-Type application/json;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
