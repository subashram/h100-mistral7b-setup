worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 1000;
    client_max_body_size 10m;
    server_tokens off;
    map_hash_bucket_size 128;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"api_key_id":"$api_key_name"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    include /etc/nginx/api_keys.conf;

    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/s;
    limit_req_status 429;

    upstream mistral_cluster {
        least_conn;
        server mistral-g0:8000 max_fails=3 fail_timeout=30s;
        server mistral-g1:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location /health {
            access_log off;
            return 200 '{"status":"ok","model":"mistral7b"}';
            add_header Content-Type application/json;
        }

        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://mistral_cluster/metrics;
        }

        location /nginx_status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            stub_status;
        }

        location /v1/ {
            if ($api_key_name = "") {
                return 401 '{"error":"Invalid or missing API key"}';
            }

            limit_req zone=global burst=100 nodelay;

            proxy_pass http://mistral_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            add_header X-Request-ID $request_id always;
            add_header X-Upstream $upstream_addr always;
            add_header X-Model-Lane mistral7b always;
        }

        location / {
            return 404 '{"error":"Not found"}';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 '{"status":"ok","model":"mistral7b"}';
            add_header Content-Type application/json;
        }

        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://mistral_cluster/metrics;
        }

        location /nginx_status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            stub_status;
        }

        location /v1/ {
            if ($api_key_name = "") {
                return 401 '{"error":"Invalid or missing API key"}';
            }

            limit_req zone=global burst=100 nodelay;

            proxy_pass http://mistral_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            add_header X-Request-ID $request_id always;
            add_header X-Upstream $upstream_addr always;
            add_header X-Model-Lane mistral7b always;
        }

        location / {
            return 404 '{"error":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
